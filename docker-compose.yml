services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-RaceDay_Local_2026!Strong}"
    ports: ["1433:1433"]
    volumes: ["raceday_sql:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment:
      ConnectionStrings__DefaultConnection: "Server=sql,1433;Database=RaceDayDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-RaceDay_Local_2026!Strong};TrustServerCertificate=True;Encrypt=False"
      Auth__OrganiserAccessCode: "${RACEDAY_ORGANISER_CODE:-RACEDAY-ORGANISER-2026}"
      AzureBlobStorage__ConnectionString: "${AZURE_BLOB_CONNECTION_STRING:-}"
    depends_on:
      sql: { condition: service_healthy }
    ports: ["5080:8080"]
  mvc:
    build: { context: ., dockerfile: Dockerfile.mvc }
    environment:
      Api__BaseUrl: http://api:8080/
    depends_on: [api]
    ports: ["8080:8080"]
volumes:
  raceday_sql:
